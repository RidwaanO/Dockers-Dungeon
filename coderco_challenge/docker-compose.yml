services:

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile.flask
    expose:
      - "5002"
    depends_on:
      redis:
        condition: service_healthy  # Ensures Redis is healthy before starting Flask
    environment: 
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  
  nginx:
    image: nginx:latest
    ports:
      - "5002:5002"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

volumes:
  redis-data: